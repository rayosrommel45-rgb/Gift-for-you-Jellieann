<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift For Her</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; /* Inaalis ang blue highlight pag clinick sa phone */
        }

        body {
            background-color: #0d0d1a; 
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .title-text {
            position: absolute;
            top: 15%;
            font-size: 24px;
            letter-spacing: 3px;
            font-weight: bold;
            transition: all 0.5s ease;
            text-align: center;
            width: 100%;
            z-index: 10;
        }

        /* --- STAGE 1: HEART --- */
        .heart-btn {
            font-size: 120px;
            cursor: pointer;
            filter: drop-shadow(0 0 20px rgba(209, 59, 250, 0.8));
            animation: beat 1.5s infinite;
            transition: all 0.5s ease;
            position: absolute;
            padding: 50px; /* Malaking pindutan */
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* --- STAGE 2: FLOWERS & ENVELOPE --- */
        .bouquet {
            position: absolute;
            top: 25%;
            font-size: 140px;
            opacity: 0;
            transform: scale(0) translateY(50px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 30px rgba(209, 59, 250, 0.6));
        }

        /* Pinalaki at ginawang madaling pindutin */
        .envelope-btn {
            position: absolute;
            bottom: 15%;
            width: 200px; /* Mas malaki */
            height: 140px; /* Mas malaki */
            background: #ffb6c1;
            border-radius: 10px;
            cursor: pointer;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 2;
            border: 3px solid #ff8da1;
        }

        /* Triangle flap ng envelope */
        .envelope-btn::before {
            content: '';
            position: absolute;
            top: 0;
            border-left: 100px solid transparent; /* Sinunod sa lapad */
            border-right: 100px solid transparent;
            border-top: 70px solid #ff8da1;
            border-radius: 10px 10px 0 0;
            transition: all 0.5s ease;
            transform-origin: top;
        }

        .envelope-heart {
            font-size: 30px;
            z-index: 3;
            margin-top: 30px;
            transition: opacity 0.3s;
        }

        /* Instruction para sa user */
        .tap-hint {
            position: absolute;
            bottom: 5%;
            font-size: 14px;
            color: #aaa;
            opacity: 0;
            transition: opacity 0.5s;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* --- STAGE 3: THE LETTER CARD --- */
        .letter-card {
            position: absolute;
            bottom: 20%;
            width: 280px;
            height: 200px;
            background: #fffaf0;
            border-radius: 10px;
            padding: 15px;
            color: #333;
            text-align: center;
            opacity: 0;
            transform: translateY(50px) scale(0.8);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px dashed #ffb6c1;
            z-index: 1;
        }

        .letter-card h3 { font-size: 16px; margin-bottom: 5px; color: #d13bfa; }
        .letter-card p { font-size: 11px; margin-bottom: 10px; line-height: 1.4; }
        .bears { font-size: 50px; margin: 10px 0; }
        .signature { font-size: 11px; font-style: italic; color: #888; }

        /* --- ANIMATION STATES --- */

        /* Pag clinick sa Heart */
        .scene.step-2 .heart-btn {
            opacity: 0;
            transform: scale(0);
            animation: none;
        }
        .scene.step-2 .bouquet {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .scene.step-2 .envelope-btn {
            opacity: 1;
            transform: scale(1);
            transition-delay: 0.5s; 
        }
        .scene.step-2 .tap-hint {
            opacity: 1;
            transition-delay: 1s;
        }

        /* Pag clinick sa Envelope */
        .scene.step-3 .bouquet {
            transform: scale(0.8) translateY(-30px);
        }
        .scene.step-3 .envelope-btn::before {
            transform: rotateX(180deg);
        }
        .scene.step-3 .envelope-heart {
            opacity: 0; 
        }
        .scene.step-3 .letter-card {
            opacity: 1;
            transform: translateY(-50px) scale(1); 
            z-index: 5; 
            transition-delay: 0.3s;
        }
        .scene.step-3 .tap-hint {
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="scene" id="main-scene">
        
        <div class="title-text" id="title">TAP TO OPEN</div>
        
        <!-- Step 1: Heart -->
        <div class="heart-btn" id="heart">💜</div>

        <!-- Step 2: Flowers & Envelope -->
        <div class="bouquet">💐</div>
        
        <!-- Pinalaking Envelope Button -->
        <div class="envelope-btn" id="envelope">
            <div class="envelope-heart">💗</div>
        </div>
        
        <div class="tap-hint" id="hint">Tap the envelope</div>

        <!-- Step 3: The Letter -->
        <div class="letter-card">
            <h3>Dear Love,</h3>
            <p>Today is not a special date, but for me it is a unique day.</p>
            <div class="bears">🧸💖🐻</div>
            <p class="signature">I like you just the way you are. Happy month.</p>
        </div>

    </div>

    <script>
        const scene = document.getElementById('main-scene');
        const heart = document.getElementById('heart');
        const envelope = document.getElementById('envelope');
        const title = document.getElementById('title');
        const hint = document.getElementById('hint');

        // Event 1: Pindot sa Puso
        heart.addEventListener('click', () => {
            scene.classList.add('step-2');
            title.innerText = "Flowers For You";
            title.style.color = "#d13bfa";
            title.style.top = "5%";
            title.style.fontStyle = "italic";
            title.style.textShadow = "0 0 10px #d13bfa";
        });

        // Event 2: Pindot sa Envelope (Kahit saan parte ng envelope pindutin, gagana)
        envelope.addEventListener('click', () => {
            scene.classList.add('step-3');
            title.innerText = "A Message For You";
            title.style.transition = "opacity 0.3s";
            title.style.opacity = "0"; 
        });
    </script>

</body>
</html>
