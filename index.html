<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift For Jellieann</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: #0d0d1a; 
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Falling Petals Effect Background */
        .petal {
            position: absolute;
            top: -20px;
            font-size: 20px;
            opacity: 0;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .title-text {
            position: absolute;
            top: 15%;
            font-size: 24px;
            letter-spacing: 3px;
            font-weight: bold;
            transition: all 0.5s ease;
            text-align: center;
            width: 100%;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* STAGE 1: HEART */
        .heart-btn {
            font-size: 120px;
            cursor: pointer;
            filter: drop-shadow(0 0 20px rgba(209, 59, 250, 0.8));
            animation: beat 1.5s infinite;
            transition: all 0.5s ease;
            position: absolute;
            padding: 50px;
            user-select: none;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* STAGE 2: FLOWERS & ENVELOPE */
        .bouquet {
            position: absolute;
            top: 25%;
            font-size: 140px;
            opacity: 0;
            transform: scale(0) translateY(50px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 30px rgba(209, 59, 250, 0.6));
            user-select: none;
        }

        .envelope-btn {
            position: absolute;
            bottom: 15%;
            width: 200px; 
            height: 140px; 
            background: #ffb6c1;
            border-radius: 10px;
            cursor: pointer;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 2;
            border: 3px solid #ff8da1;
        }

        .envelope-btn::before {
            content: '';
            position: absolute;
            top: 0;
            border-left: 100px solid transparent; 
            border-right: 100px solid transparent;
            border-top: 70px solid #ff8da1;
            border-radius: 10px 10px 0 0;
            transition: all 0.5s ease;
            transform-origin: top;
        }

        .envelope-heart {
            font-size: 30px;
            z-index: 3;
            margin-top: 30px;
            transition: opacity 0.3s;
        }

        .tap-hint {
            position: absolute;
            bottom: 5%;
            font-size: 14px;
            color: #aaa;
            opacity: 0;
            transition: opacity 0.5s;
            animation: blink 1.5s infinite;
            font-style: italic;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* STAGE 3: THE LETTER CARD */
        .letter-card {
            position: absolute;
            bottom: 10%; /* Inusog natin pataas ng konti para magkasya ang picture */
            width: 280px;
            height: 320px; /* Pinalaki natin ang card */
            background: #fffaf0;
            border-radius: 10px;
            padding: 15px;
            color: #333;
            text-align: center;
            opacity: 0;
            transform: translateY(50px) scale(0.8);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px dashed #ffb6c1;
            z-index: 1;
        }

        /* BAGONG DAGDAG: Design para sa Picture */
        .photo-frame {
            width: 100%;
            height: 150px;
            object-fit: cover; /* Para hindi mabatak ang picture */
            border-radius: 8px;
            margin-bottom: 10px;
            border: 3px solid #ffb6c1;
        }

        .letter-card h3 { font-size: 16px; margin-bottom: 5px; color: #d13bfa; }
        .letter-card p { font-size: 11px; margin-bottom: 10px; line-height: 1.4; }
        .signature { font-size: 11px; font-style: italic; color: #888; }

        /* ANIMATION STATES */
        .scene.step-2 .heart-btn { opacity: 0; transform: scale(0); animation: none; }
        .scene.step-2 .bouquet { opacity: 1; transform: scale(1) translateY(0); }
        .scene.step-2 .envelope-btn { opacity: 1; transform: scale(1); transition-delay: 0.5s; }
        .scene.step-2 .tap-hint { opacity: 1; transition-delay: 1s; }

        .scene.step-3 .bouquet { transform: scale(0.8) translateY(-40px); }
        .scene.step-3 .envelope-btn::before { transform: rotateX(180deg); }
        .scene.step-3 .envelope-heart { opacity: 0; }
        .scene.step-3 .letter-card { opacity: 1; transform: translateY(-80px) scale(1); z-index: 5; transition-delay: 0.3s; }
        .scene.step-3 .tap-hint { opacity: 0; }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="scene" id="main-scene">
        
        <div class="title-text" id="title">Para kay Jellieann 💜</div>
        
        <div class="heart-btn" id="heart">💜</div>
        <div class="bouquet">💐</div>
        
        <div class="envelope-btn" id="envelope">
            <div class="envelope-heart">💗</div>
        </div>
        
        <div class="tap-hint" id="hint">Tap the envelope</div>

        <!-- Step 3: The Letter with Picture -->
        <div class="letter-card">
            <!-- Dito natin nilagay ang picture mo. Siguraduhing picture.jpg ang filename sa github -->
            <img src="picture.jpg" alt="Our Picture" class="photo-frame">
            
            <h3>Dear Jellieann,</h3>
            <p>Hindi man ito espesyal na araw, pero para sa akin, espesyal ka araw-araw.</p>
            <p class="signature">I like you just the way you are. Happy month! - Rommel</p>
        </div>

    </div>

    <script>
        const scene = document.getElementById('main-scene');
        const heart = document.getElementById('heart');
        const envelope = document.getElementById('envelope');
        const title = document.getElementById('title');
        const music = document.getElementById('bg-music');

        function createPetals() {
            const petalEmojis = ['🌸', '✨', '🌺', '💜'];
            setInterval(() => {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                petal.innerText = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = Math.random() * 3 + 3 + 's'; 
                petal.style.fontSize = Math.random() * 20 + 10 + 'px';
                document.body.appendChild(petal);
                
                setTimeout(() => { petal.remove(); }, 6000);
            }, 300); 
        }

        createPetals(); 

        heart.addEventListener('click', () => {
            scene.classList.add('step-2');
            title.innerText = "Flowers For You";
            title.style.color = "#d13bfa";
            title.style.top = "5%";
            title.style.fontStyle = "italic";
            
            music.volume = 0.5; 
            music.play().catch(err => console.log("Autoplay blocked:", err));
        });

        envelope.addEventListener('click', () => {
            scene.classList.add('step-3');
            title.style.transition = "opacity 0.3s";
            title.style.opacity = "0"; 
        });
    </script>

</body>
</html>
