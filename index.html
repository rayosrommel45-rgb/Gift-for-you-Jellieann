<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift For Jellieann</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            /* Pinalitan natin ang background ng gradient na parang night sky */
            background: linear-gradient(to bottom, #050510 0%, #151530 50%, #2a1b38 100%);
            color: white;
            font-family: 'Courier New', Courier, monospace; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- STAR BACKGROUND EFFECTS --- */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px white; }
        }

        /* SHOOTING STAR (BULALAKAW) */
        .shooting-star {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
            opacity: 0;
        }
        
        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 0;
            width: 150px;
            height: 1px;
            background: linear-gradient(to left, white, transparent);
            transform: translateY(-50%);
        }

        @keyframes shoot {
            0% { transform: translate(0, 0) rotate(-45deg); opacity: 1; }
            100% { transform: translate(-600px, 600px) rotate(-45deg); opacity: 0; }
        }

        /* Falling Petals Effect */
        .petal {
            position: absolute;
            top: -20px;
            font-size: 20px;
            opacity: 0;
            animation: fall linear infinite;
            z-index: 2;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Explosion Hearts */
        .explosion-heart {
            position: absolute;
            font-size: 30px;
            pointer-events: none;
            z-index: 100;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .title-text {
            position: absolute;
            top: 15%;
            font-size: 24px;
            letter-spacing: 3px;
            font-weight: bold;
            transition: all 0.5s ease;
            text-align: center;
            width: 100%;
            text-shadow: 0 0 15px rgba(209, 59, 250, 0.8); /* Purple glow sa title */
            font-family: Arial, sans-serif;
        }

        /* STAGE 1: HEART */
        .heart-btn {
            font-size: 120px;
            cursor: pointer;
            filter: drop-shadow(0 0 25px rgba(209, 59, 250, 1));
            animation: beat 1.5s infinite;
            transition: all 0.5s ease;
            position: absolute;
            padding: 50px;
            user-select: none;
            z-index: 15;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* STAGE 2: FLOWERS & ENVELOPE */
        .bouquet {
            position: absolute;
            top: 25%;
            font-size: 140px;
            opacity: 0;
            transform: scale(0) translateY(50px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 30px rgba(209, 59, 250, 0.6));
            user-select: none;
            z-index: 15;
        }

        .envelope-btn {
            position: absolute;
            bottom: 15%;
            width: 200px; 
            height: 140px; 
            background: #ffb6c1;
            border-radius: 10px;
            cursor: pointer;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            z-index: 15;
            border: 3px solid #ff8da1;
        }

        .envelope-btn::before {
            content: '';
            position: absolute;
            top: 0;
            border-left: 100px solid transparent; 
            border-right: 100px solid transparent;
            border-top: 70px solid #ff8da1;
            border-radius: 10px 10px 0 0;
            transition: all 0.5s ease;
            transform-origin: top;
        }

        .envelope-heart {
            font-size: 30px;
            z-index: 16;
            margin-top: 30px;
            transition: opacity 0.3s;
        }

        .tap-hint {
            position: absolute;
            bottom: 5%;
            font-size: 14px;
            color: #aaa;
            opacity: 0;
            transition: opacity 0.5s;
            animation: blink 1.5s infinite;
            font-style: italic;
            font-family: Arial, sans-serif;
            z-index: 15;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* STAGE 3: THE LETTER CARD */
        .letter-card {
            position: absolute;
            bottom: 10%;
            width: 280px;
            height: 320px;
            background: #fffaf0;
            border-radius: 10px;
            padding: 15px;
            color: #333;
            text-align: center;
            opacity: 0;
            transform: translateY(50px) scale(0.8);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border: 2px dashed #ffb6c1;
            z-index: 12;
        }

        .photo-frame {
            width: 100%;
            height: 150px;
            object-fit: cover; 
            border-radius: 8px;
            margin-bottom: 10px;
            border: 3px solid #ffb6c1;
        }

        .letter-card h3 { font-size: 16px; margin-bottom: 5px; color: #d13bfa; text-align: left; }
        .typed-text { font-size: 12px; line-height: 1.4; text-align: left; min-height: 40px; }
        .cursor { display: inline-block; width: 2px; height: 14px; background-color: #333; animation: blink-cursor 0.7s infinite; vertical-align: middle; margin-left: 2px; }
        @keyframes blink-cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .signature { font-size: 11px; font-style: italic; color: #888; text-align: right; margin-top: 10px; }

        /* ANIMATION STATES */
        .scene.step-2 .heart-btn { opacity: 0; transform: scale(0); animation: none; }
        .scene.step-2 .bouquet { opacity: 1; transform: scale(1) translateY(0); }
        .scene.step-2 .envelope-btn { opacity: 1; transform: scale(1); transition-delay: 0.5s; }
        .scene.step-2 .tap-hint { opacity: 1; transition-delay: 1s; }

        .scene.step-3 .bouquet { transform: scale(0.8) translateY(-40px); }
        .scene.step-3 .envelope-btn::before { transform: rotateX(180deg); }
        .scene.step-3 .envelope-heart { opacity: 0; }
        .scene.step-3 .letter-card { opacity: 1; transform: translateY(-80px) scale(1); z-index: 20; transition-delay: 0.3s; }
        .scene.step-3 .tap-hint { opacity: 0; }
    </style>
</head>
<body>

    <!-- Background Stars Container -->
    <div class="stars" id="stars-container"></div>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="scene" id="main-scene">
        
        <div class="title-text" id="title">Para kay Jellieann 💜</div>
        
        <div class="heart-btn" id="heart">💜</div>
        <div class="bouquet">💐</div>
        
        <div class="envelope-btn" id="envelope">
            <div class="envelope-heart">💗</div>
        </div>
        
        <div class="tap-hint" id="hint">Tap the envelope</div>

        <div class="letter-card">
            <img src="picture.jpg" alt="Our Picture" class="photo-frame">
            <h3>Dear Jellieann,</h3>
            <p class="typed-text"><span id="typing-span"></span><span class="cursor"></span></p>
            <p class="signature">- Rommel</p>
        </div>

    </div>

    <script>
        const scene = document.getElementById('main-scene');
        const heart = document.getElementById('heart');
        const envelope = document.getElementById('envelope');
        const title = document.getElementById('title');
        const music = document.getElementById('bg-music');
        const typingSpan = document.getElementById('typing-span');
        const starsContainer = document.getElementById('stars-container');

        const message = "Hindi man ito espesyal na araw, pero para sa akin, espesyal ka araw-araw. I like you just the way you are. Happy month!";

        // 1. Function para sa Stars at Shooting Stars
        function createStars() {
            // Gumawa ng 50 maliliit na bituin
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDuration = Math.random() * 2 + 1 + 's';
                starsContainer.appendChild(star);
            }

            // Gumawa ng bulalakaw paminsan-minsan
            setInterval(() => {
                const shootingStar = document.createElement('div');
                shootingStar.classList.add('shooting-star');
                shootingStar.style.left = Math.random() * 50 + 50 + 'vw'; // Sa kanang side
                shootingStar.style.top = Math.random() * 30 + 'vh'; // Sa taas
                shootingStar.style.animation = 'shoot 1.5s linear forwards';
                starsContainer.appendChild(shootingStar);
                
                setTimeout(() => { shootingStar.remove(); }, 1500);
            }, 4000); // Meron every 4 seconds
        }

        // 2. Function para sa Falling Petals
        function createPetals() {
            const petalEmojis = ['🌸', '✨', '🌺', '💜'];
            setInterval(() => {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                petal.innerText = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = Math.random() * 3 + 3 + 's'; 
                petal.style.fontSize = Math.random() * 20 + 10 + 'px';
                document.body.appendChild(petal);
                setTimeout(() => { petal.remove(); }, 6000);
            }, 400); 
        }

        // 3. Function para sa Typewriter
        function typeWriter(text, i, fnCallback) {
            if (i < (text.length)) {
                typingSpan.innerHTML = text.substring(0, i+1); 
                setTimeout(function() {
                    typeWriter(text, i + 1, fnCallback)
                }, 50); 
            } else if (typeof fnCallback == 'function') {
                setTimeout(fnCallback, 700); 
            }
        }

        // 4. Function para sa Explosion
        function createExplosion() {
            const heartEmojis = ['💖', '💜', '💗', '❤️', '✨'];
            for (let i = 0; i < 30; i++) {
                const explosionHeart = document.createElement('div');
                explosionHeart.classList.add('explosion-heart');
                explosionHeart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                explosionHeart.style.left = '50%';
                explosionHeart.style.bottom = '20%'; 
                const angle = Math.random() * Math.PI * 2; 
                const distance = Math.random() * 200 + 100; 
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                explosionHeart.style.setProperty('--tx', tx + 'px');
                explosionHeart.style.setProperty('--ty', ty + 'px');
                const scale = Math.random() * 1 + 0.5;
                explosionHeart.style.fontSize = (scale * 20) + 'px';
                document.body.appendChild(explosionHeart);
                setTimeout(() => { explosionHeart.remove(); }, 1000);
            }
        }

        // Start background effects
        createStars();
        createPetals();

        // Event Listeners
        heart.addEventListener('click', () => {
            scene.classList.add('step-2');
            title.innerText = "Flowers For You";
            title.style.color = "#d13bfa";
            title.style.top = "5%";
            title.style.fontStyle = "italic";
            
            music.volume = 0.5; 
            music.play().catch(err => console.log("Autoplay blocked:", err));
        });

        envelope.addEventListener('click', () => {
            scene.classList.add('step-3');
            title.style.transition = "opacity 0.3s";
            title.style.opacity = "0"; 
            
            setTimeout(() => {
                typeWriter(message, 0, function() {});
            }, 800);

            createExplosion();
        });
    </script>

</body>
</html>
